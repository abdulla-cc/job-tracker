# ==============================================================================
# Render Blueprint Specification (render.yaml)
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Backend API (FastAPI)
  # ----------------------------------------------------------------------------
  - type: web
    name: job-tracker-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "1440"
      - key: GROQ_API_KEY
        sync: false # Set manually in Render dashboard
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: job-tracker-web
          property: host
      # Automatically wire Render Postgres database connection string
      - key: DATABASE_URL
        fromDatabase:
          name: job-tracker-db
          property: connectionString

  # ----------------------------------------------------------------------------
  # 2. Frontend Web App (React / Vite Static Site)
  # ----------------------------------------------------------------------------
  - type: web
    name: job-tracker-web
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      # SPA rewrite rule: maps all paths (e.g. /cv, /analyze) back to index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: job-tracker-api
          property: host

# ------------------------------------------------------------------------------
# 3. Managed PostgreSQL Database (Render Free Tier)
# ------------------------------------------------------------------------------
databases:
  - name: job-tracker-db
    plan: free
    databaseName: jobtracker
    user: jobtracker_user
